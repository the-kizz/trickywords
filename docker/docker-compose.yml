# Tricky Words — one container, one database, one image, one variable.
#
# Port 3000 is the family surface: named child profiles, real per-word
# progress, the parent area, any voice recordings a parent has made.
# Keep it on your LAN or behind a VPN — do NOT expose it to the
# internet.
#
# Port 3001 is the guest surface, and nothing listens on it until you
# uncomment TRICKYWORDS_PUBLIC below. That is the switch: not a flag the
# app checks, an absent socket. Switched on, the guest listener serves
# `/play` and the static assets it needs and 404s everything else before
# it reaches the app — see SECURITY.md for the boundary and its limits.
#
# The one writable mount is the family data volume, because family mode
# needs it. Do not add another.
services:
  trickywords:
    image: ghcr.io/the-kizz/trickywords:latest
    container_name: trickywords
    restart: unless-stopped
    environment:
      TZ: Etc/UTC
      # Switch the guest side on. Accepts 1, true or yes; anything else
      # (a typo included) leaves port 3001 unbound.
      # TRICKYWORDS_PUBLIC: "1"
    ports:
      # Family surface — LAN or VPN only.
      - "3000:3000"
      # Guest surface — only ever bound when TRICKYWORDS_PUBLIC is set.
      # Put a reverse proxy in front of this one, not the other.
      - "3001:3001"
    volumes:
      - trickywords_data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  trickywords_data:
